# ==========================================================
# negocio-service - perfil por defecto (dev): H2 en memoria.
#
# Unifica lo que antes eran usuarios-service (8082) y catalogo-service (8083).
# Una sola app, una sola base. La comunicacion entre los sub-dominios
# catalogo <-> usuarios ya NO es HTTP: es una llamada Java directa via los
# puertos catalogo.spi.ResolucionVendedores y usuarios.spi.ConsultaCatalogo.
# ==========================================================
spring.application.name=negocio-service
server.port=8082

spring.datasource.url=jdbc:h2:mem:negociodb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# En dev (H2 en memoria) el esquema lo arma Hibernate. Flyway se usa solo
# en el perfil docker (Postgres), ver application-docker.properties.
spring.flyway.enabled=false

# --- JWT: solo validacion (clave publica). Este servicio no firma. ---
app.jwt.public-key-location=classpath:jwt-public.pem
app.jwt.issuer=gamestore-auth

# --- Servicios remotos que quedan ---
# auth-service sigue siendo remoto: aca vive el perfil del usuario, pero la
# credencial (hash) la administra auth-service (ver usuarios/client/AuthClient).
app.services.auth-url=http://localhost:8081
app.internal.secret=dev-internal-secret-cambiar-en-prod

# --- Imagenes subidas por los vendedores ---
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Resilience4j: solo la llamada a auth-service ---
resilience4j.retry.instances.auth.max-attempts=3
resilience4j.retry.instances.auth.wait-duration=300ms

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
