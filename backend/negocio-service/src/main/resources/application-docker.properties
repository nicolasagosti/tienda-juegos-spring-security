# negocio-service - perfil "docker": una unica base Postgres (negocio-db).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://negocio-db:5432/negociodb}
spring.datasource.username=${DATABASE_USERNAME:negocio}
spring.datasource.password=${DATABASE_PASSWORD:negocio}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Esquema versionado con Flyway (db/migration/V*.sql). Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.jwt.public-key-location=${APP_JWT_PUBLIC_KEY_LOCATION:classpath:jwt-public.pem}
app.services.auth-url=${AUTH_URL:http://auth-service:8081}
app.internal.secret=${INTERNAL_SECRET:dev-internal-secret-cambiar-en-prod}

# Disco de imagenes: volumen montado en el contenedor.
app.upload.dir=${UPLOAD_DIR:/data/uploads}
