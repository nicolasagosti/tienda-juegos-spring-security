# Configuracion de SonarQube para negocio-service.
#
# Uso (necesita un servidor Sonar/SonarCloud y un token):
#   cd backend
#   mvn -pl negocio-service -am clean verify
#   mvn -pl negocio-service sonar:sonar \
#       -Dsonar.host.url=http://localhost:9000 \
#       -Dsonar.token=$SONAR_TOKEN
#
# El plugin sonar-maven-plugin toma estas claves; el XML de cobertura lo
# genera JaCoCo en target/site/jacoco/jacoco.xml (ver pom padre).

sonar.projectKey=gamestore-negocio-service
sonar.projectName=negocio-service
sonar.projectVersion=1.0.0

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# Codigo generado / de demo que no aporta a la deuda tecnica del dominio.
sonar.coverage.exclusions=\
  **/NegocioServiceApplication.java,\
  **/config/**,\
  **/*DataInitializer.java,\
  **/catalogo/service/GeneradorPortadas.java
