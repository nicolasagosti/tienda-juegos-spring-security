name: CI

# Corre en cada push y cada Pull Request contra main o develop. La idea
# del flujo de ramas: se trabaja sobre "develop" (o ramas de feature que
# mergean a "develop"), y "main" es la rama de produccion. El deploy en
# si (CD) lo hacen Vercel y Render/Railway con su propia integracion
# nativa de GitHub una vez que conectas el repo (ver DEPLOY.md) -- este
# workflow es la parte de CI: valida que el backend y el frontend
# compilen y pasen sus tests ANTES de mergear, en cada PR.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  services:
    name: Microservicios (Maven reactor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y empaquetar los 5 modulos
        run: mvn -B -f services/pom.xml verify

  frontend:
    name: Frontend (React/Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build de produccion (modo standalone, como Vercel)
        run: npm run build
        env:
          VITE_STANDALONE_BUILD: 'true'
