# ==========================================================
# Configuracion general de la aplicacion (perfil por defecto = "dev",
# pensado para correr todo en un solo proceso local). Para el despliegue
# separado (React en Vercel + este backend en Render/Railway/etc), ver
# application-prod.properties, activado con SPRING_PROFILES_ACTIVE=prod.
# ==========================================================
spring.application.name=tienda-juegos

# Origenes permitidos para /api/** por CORS. En local, el propio backend
# (8080/8081, cuando React va embebido) y el server de desarrollo de Vite
# (5173, cuando corres "npm run dev" aparte). Ver SecurityConfig.
app.cors.allowed-origins=http://localhost:5173,http://localhost:8080,http://localhost:8081

# ==========================================================
# Base de datos H2 en memoria (solo para esta demo).
# Los datos se pierden al reiniciar la aplicacion: el
# DataInitializer los vuelve a crear en cada arranque.
# ==========================================================
spring.datasource.url=jdbc:h2:mem:tiendajuegos;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 (solo DEV) -> http://localhost:8080/h2-console
# JDBC URL a usar dentro de la consola: jdbc:h2:mem:tiendajuegos
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

server.port=8080

# Carpeta donde se guardan las imagenes de los juegos subidas por los vendedores
app.upload.dir=uploads

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
