<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${esNuevo} ? 'Publicar juego - GameStore' : 'Editar juego - GameStore'">Formulario</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container container-form">
    <h1 th:text="${esNuevo} ? 'Publicar nuevo juego' : 'Editar juego'">Formulario</h1>

    <form th:action="${esNuevo} ? @{/juegos/guardar} : @{/juegos/{id}/guardar(id=${juego.id})}"
          method="post" enctype="multipart/form-data" class="form-card">

        <label for="nombre">Nombre del juego</label>
        <input type="text" id="nombre" name="nombre" th:value="${juego.nombre}" required="required">

        <label for="descripcion">Descripcion</label>
        <textarea id="descripcion" name="descripcion" rows="4" th:text="${juego.descripcion}"></textarea>

        <label for="precio">Precio (USD)</label>
        <input type="number" id="precio" name="precio" step="0.01" min="0" th:value="${juego.precio}" required="required">

        <label for="seccionId">Seccion / categoria</label>
        <select id="seccionId" name="seccionId">
            <option value="">-- Sin seccion --</option>
            <option th:each="s : ${secciones}" th:value="${s.id}" th:text="${s.nombre}"
                    th:selected="${juego.seccion != null and juego.seccion.id == s.id}"></option>
        </select>

        <label for="imagen">Imagen de portada</label>
        <input type="file" id="imagen" name="imagen" accept="image/*">
        <p class="hint" th:if="${juego.imagenUrl}">Imagen actual:</p>
        <img th:if="${juego.imagenUrl}" th:src="@{${juego.imagenUrl}}" class="preview-actual" alt="imagen actual">

        <div class="form-actions">
            <button type="submit" class="btn btn-primary" th:text="${esNuevo} ? 'Publicar' : 'Guardar cambios'">Guardar</button>
            <a th:href="@{/juegos}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
