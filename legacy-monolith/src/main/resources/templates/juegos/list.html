<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Catalogo de juegos - GameStore</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
    <div th:replace="~{fragments :: alertas}"></div>

    <div class="page-header">
        <h1>Catalogo de juegos</h1>
        <a th:href="@{/juegos/nuevo}" class="btn btn-primary" sec:authorize="hasAnyRole('VENDEDOR','ADMIN')">+ Publicar juego</a>
    </div>

    <p class="info-banner" sec:authorize="hasRole('COMPRADOR')">
        Estas viendo el catalogo en modo <strong>solo lectura</strong>. Como comprador podes ver los juegos, pero no publicarlos ni editarlos.
    </p>

    <div class="grid-juegos">
        <div class="card-juego" th:each="juego : ${juegos}">
            <div class="card-imagen">
                <img th:if="${juego.imagenUrl}" th:src="@{${juego.imagenUrl}}" alt="portada del juego">
                <div class="sin-imagen" th:unless="${juego.imagenUrl}">Sin imagen</div>
            </div>
            <div class="card-body">
                <h3 th:text="${juego.nombre}">Nombre del juego</h3>
                <p class="precio" th:text="${'$ ' + juego.precio}">$ 0.00</p>
                <p class="descripcion" th:text="${juego.descripcion}">Descripcion</p>
                <p class="meta">
                    <span class="tag" th:if="${juego.seccion}" th:text="${juego.seccion.nombre}">Seccion</span>
                    <span class="vendedor-nombre">por <strong th:text="${juego.vendedor.nombreCompleto}">Vendedor</strong></span>
                </p>
                <div class="card-actions"
                     th:if="${usuarioActual.rol.name() == 'ADMIN' or juego.vendedor.id == usuarioActual.id}">
                    <a th:href="@{/juegos/editar/{id}(id=${juego.id})}" class="btn btn-secondary btn-sm">Editar</a>
                    <form th:action="@{/juegos/{id}/eliminar(id=${juego.id})}" method="post" class="inline-form"
                          onsubmit="return confirm('Seguro que queres eliminar este juego?');">
                        <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                    </form>
                </div>
            </div>
        </div>

        <p th:if="${#lists.isEmpty(juegos)}" class="empty">Todavia no hay juegos publicados.</p>
    </div>
</main>
</body>
</html>
