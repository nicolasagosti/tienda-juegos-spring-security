<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!--
  Fragmento de navegacion. Se incluye en todas las paginas con
  th:replace="~{fragments :: nav}".

  Las etiquetas sec:authorize son de thymeleaf-extras-springsecurity6:
  evaluan la misma expresion de SpEL de seguridad que usariamos en un
  @PreAuthorize, pero del lado de la vista, para mostrar u ocultar
  botones segun el rol del usuario logueado. OJO: esto es solo estetico,
  la proteccion real (la que importa) siempre esta en el backend
  (SecurityConfig + @PreAuthorize) porque el HTML lo puede editar
  cualquiera desde el navegador.
-->
<nav th:fragment="nav" class="navbar">
    <div class="navbar-brand">
        <a th:href="@{/juegos}">GameStore</a>
    </div>
    <div class="navbar-links">
        <a th:href="@{/juegos}">Catalogo</a>
        <a th:href="@{/juegos/nuevo}" sec:authorize="hasAnyRole('VENDEDOR','ADMIN')">Publicar juego</a>
        <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">Panel admin</a>
        <a th:href="@{/admin/usuarios}" sec:authorize="hasRole('ADMIN')">Usuarios</a>
        <a th:href="@{/admin/secciones}" sec:authorize="hasRole('ADMIN')">Secciones</a>
    </div>
    <div class="navbar-user">
        <span class="username" sec:authentication="name">usuario</span>
        <span class="badge badge-admin" sec:authorize="hasRole('ADMIN')">ADMIN</span>
        <span class="badge badge-vendedor" sec:authorize="hasRole('VENDEDOR')">VENDEDOR</span>
        <span class="badge badge-comprador" sec:authorize="hasRole('COMPRADOR')">COMPRADOR</span>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="btn-logout">Salir</button>
        </form>
    </div>
</nav>

<div th:fragment="alertas">
    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
</div>

</body>
</html>
