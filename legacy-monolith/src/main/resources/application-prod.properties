# ==========================================================
# Perfil de produccion: backend desplegado solo (Render, Railway, Fly.io,
# un VPS con Docker, etc.), con el React de Vercel pegandole por HTTP
# desde otro dominio. Se activa con la variable de entorno
# SPRING_PROFILES_ACTIVE=prod en el panel del hosting.
#
# Todas las variables de abajo (${...}) se completan con variables de
# entorno que cargas vos en el panel del proveedor. Ver DEPLOY.md para
# el paso a paso completo.
# ==========================================================

# Postgres real (Render/Railway te dan host/puerto/db/usuario/password
# por separado; armas la URL jdbc vos, ver DEPLOY.md -- ojo que el driver
# JDBC necesita el prefijo "jdbc:", no sirve el "postgres://..." que
# suelen mostrar en el dashboard tal cual).
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# En esta demo dejamos que Hibernate cree/actualice las tablas solo. Un
# proyecto real usaria migraciones versionadas (Flyway/Liquibase) en vez
# de ddl-auto=update.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Fijamos el dialecto a mano en vez de dejar que Hibernate lo autodetecte
# abriendo una conexion de prueba: si el autodetect llega a fallar (por
# ejemplo por un problema de red/SSL puntual al arrancar), preferimos que
# el error se vea despues, al primer query real, con un mensaje claro de
# conexion -- no un generico "no pude determinar el Dialect" al arrancar.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Un poco mas de margen para el primer connect: Neon "duerme" la base si
# estuvo inactiva y el primer query tras despertarla puede tardar mas que
# el timeout por defecto de Hikari (30s deberia sobrar, pero no cuesta
# nada dejarlo explicito).
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=30000

# La consola H2 no existe en este perfil (no hay H2), pero la apagamos
# explicitamente por las dudas.
spring.h2.console.enabled=false

spring.thymeleaf.cache=true

# Render/Railway/Fly inyectan su propio puerto en la variable PORT.
server.port=${PORT:8080}

# Dominio(s) de Vercel desde donde se puede llamar a la API (separados
# por coma si tenes mas de uno, por ejemplo produccion + previews):
#   https://tu-proyecto.vercel.app,https://tu-proyecto-*.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# URL del frontend en Vercel (SIN barra final), a donde redirige
# OAuth2LoginSuccessHandler despues de un login con Google exitoso.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

app.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

# Login con Google: opcional. Si no cargas estas dos variables en Render,
# la app arranca igual pero el boton de Google no funciona (ver
# OAuth2ClientConfig). Pasos para crear las credenciales en DEPLOY.md.
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Secreto para firmar los JWT. SIN valor por defecto a proposito: si te
# olvidas de configurarlo, la app no arranca en vez de arrancar insegura
# con el secreto de ejemplo del perfil dev.
app.jwt.secret=${JWT_SECRET}

# En el free tier de la mayoria de estos hostings el disco es efimero: se
# borra en cada redeploy/restart (y si tenes mas de una instancia, no se
# comparte entre ellas). Las portadas de ejemplo se regeneran solas al
# arrancar (DataInitializer), pero una imagen que suba un vendedor de
# verdad se puede perder en el proximo deploy. Para produccion en serio
# convendria un storage externo (S3, Cloudinary, etc.) en vez de disco
# local -- fuera del alcance de esta demo.
app.upload.dir=${UPLOAD_DIR:uploads}
