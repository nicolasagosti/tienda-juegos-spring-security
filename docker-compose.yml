# ==========================================================
# Tienda de juegos - version microservicios.
#
#   docker compose up --build
#   -> http://localhost:8080  (gateway: sirve React + rutea /api/**)
#
# Antes de la primera vez conviene compilar el frontend para que el
# gateway tenga algo que servir en "/":
#   cd frontend && npm install && npm run build && cd ..
# (deja el build en backend/api-gateway/src/main/resources/static)
#
# Servicios: auth-service, negocio-service (catalogo + usuarios unificados) y
# api-gateway. Cada servicio con estado tiene su propia base Postgres. El
# perfil "docker" de cada app toma estas variables.
# ==========================================================
name: gamestore

x-service-build: &service-build
  context: ./backend
  dockerfile: Dockerfile

# Limites de memoria (los aplica "docker compose up", no hace falta swarm).
# Cada JVM ajusta su heap al limite via -XX:MaxRAMPercentage (ver Dockerfile).
x-db-deploy: &db-deploy
  resources:
    limits:
      memory: 256M

x-svc-deploy: &svc-deploy
  resources:
    limits:
      memory: 700M
    reservations:
      memory: 300M

services:
  # ---------- Bases de datos (una por servicio) ----------
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    volumes: [auth-db-data:/var/lib/postgresql/data]
    deploy: { <<: *db-deploy }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d authdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  negocio-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: negociodb
      POSTGRES_USER: negocio
      POSTGRES_PASSWORD: negocio
    volumes: [negocio-db-data:/var/lib/postgresql/data]
    deploy: { <<: *db-deploy }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U negocio -d negociodb"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- Servicios ----------
  negocio-service:
    build:
      <<: *service-build
      args:
        SERVICE: negocio-service
    deploy: { <<: *svc-deploy }
    environment:
      DATABASE_URL: jdbc:postgresql://negocio-db:5432/negociodb
      DATABASE_USERNAME: negocio
      DATABASE_PASSWORD: negocio
      AUTH_URL: http://auth-service:8081
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret-cambiar-en-prod}
      UPLOAD_DIR: /data/uploads
    volumes: [negocio-uploads:/data/uploads]
    depends_on:
      negocio-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 40s

  auth-service:
    build:
      <<: *service-build
      args:
        SERVICE: auth-service
    deploy: { <<: *svc-deploy }
    environment:
      DATABASE_URL: jdbc:postgresql://auth-db:5432/authdb
      DATABASE_USERNAME: auth
      DATABASE_PASSWORD: auth
      USUARIOS_URL: http://negocio-service:8082
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret-cambiar-en-prod}
      FRONTEND_URL: http://localhost:8080
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      auth-db: { condition: service_healthy }
      negocio-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 40s

  api-gateway:
    build:
      <<: *service-build
      args:
        SERVICE: api-gateway
    deploy: { <<: *svc-deploy }
    ports:
      - "8080:8080"
    environment:
      SERVICES_AUTH_URL: http://auth-service:8081
      SERVICES_NEGOCIO_URL: http://negocio-service:8082
    depends_on:
      auth-service: { condition: service_healthy }
      negocio-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  auth-db-data:
  negocio-db-data:
  negocio-uploads:
