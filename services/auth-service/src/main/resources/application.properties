# ==========================================================
# auth-service - perfil por defecto (dev): H2 en memoria, corre solo con
# "mvn spring-boot:run" sin Docker. El perfil "docker" (Postgres) esta en
# application-docker.properties.
# ==========================================================
spring.application.name=auth-service
server.port=8081

# --- Base de datos (H2 en memoria, se recrea en cada arranque) ---
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- JWT (RS256) ---
# auth-service es el UNICO con clave privada: es el unico que firma tokens.
app.jwt.public-key-location=classpath:jwt-public.pem
app.jwt.private-key-location=classpath:jwt-private.pem
app.jwt.access-expiration-ms=900000
app.jwt.issuer=gamestore-auth
app.jwt.refresh-expiration-days=7

# --- Llamadas a otros servicios ---
app.services.usuarios-url=http://localhost:8082
# Secreto compartido para la API interna entre servicios (header X-Internal-Token).
app.internal.secret=dev-internal-secret-cambiar-en-prod

# --- OAuth2 ---
# (CORS no se configura en auth-service: lo maneja el api-gateway, que es el
#  unico que habla con navegadores. Ver SecurityConfig.)
app.frontend-url=http://localhost:5173
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# --- Resilience4j: llamadas a usuarios-service ---
resilience4j.circuitbreaker.instances.usuarios.sliding-window-size=10
resilience4j.circuitbreaker.instances.usuarios.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.usuarios.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.usuarios.permitted-number-of-calls-in-half-open-state=3
resilience4j.retry.instances.usuarios.max-attempts=3
resilience4j.retry.instances.usuarios.wait-duration=300ms

# --- Actuator (healthcheck de docker-compose) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
