# ==========================================================
# auth-service - perfil "docker": Postgres propio (contenedor auth-db).
# Se activa con SPRING_PROFILES_ACTIVE=docker (ver docker-compose.yml).
# Todo lo no redefinido aca se hereda de application.properties.
# ==========================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://auth-db:5432/authdb}
spring.datasource.username=${DATABASE_USERNAME:auth}
spring.datasource.password=${DATABASE_PASSWORD:auth}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# En el contenedor la clave publica/privada se montan como secreto; por
# defecto usamos las del classpath (demo).
app.jwt.public-key-location=${APP_JWT_PUBLIC_KEY_LOCATION:classpath:jwt-public.pem}
app.jwt.private-key-location=${APP_JWT_PRIVATE_KEY_LOCATION:classpath:jwt-private.pem}

app.services.usuarios-url=${USUARIOS_URL:http://usuarios-service:8082}
app.internal.secret=${INTERNAL_SECRET:dev-internal-secret-cambiar-en-prod}

app.frontend-url=${FRONTEND_URL:http://localhost:8080}
