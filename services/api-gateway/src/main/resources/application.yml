# ==========================================================
# api-gateway - perfil por defecto (dev): apunta a los servicios en
# localhost:808x. El perfil "docker" (application-docker.yml) usa los
# nombres de servicio de docker-compose.
# ==========================================================
server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # CORS: para cuando el React corre aparte en "npm run dev" (:5173).
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:5173"
              - "http://localhost:8080"
            allowed-methods: [GET, POST, PUT, DELETE, OPTIONS]
            allowed-headers: [Authorization, Content-Type]
            allow-credentials: false
      routes:
        - id: auth-service
          uri: ${SERVICES_AUTH_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        - id: usuarios-service
          uri: ${SERVICES_USUARIOS_URL:http://localhost:8082}
          predicates:
            - Path=/api/usuarios/**,/api/admin/**

        - id: catalogo-service-api
          uri: ${SERVICES_CATALOGO_URL:http://localhost:8083}
          predicates:
            - Path=/api/juegos/**,/api/secciones/**

        - id: catalogo-service-uploads
          uri: ${SERVICES_CATALOGO_URL:http://localhost:8083}
          predicates:
            - Path=/uploads/**

# --- JWT: solo la clave publica; el gateway solo valida ---
app:
  jwt:
    public-key-location: classpath:jwt-public.pem
    issuer: gamestore-auth

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
