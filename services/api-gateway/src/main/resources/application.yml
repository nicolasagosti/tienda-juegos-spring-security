# ==========================================================
# api-gateway - perfil por defecto (dev): apunta a los servicios en
# localhost:808x. El perfil "docker" (application-docker.yml) usa los
# nombres de servicio de docker-compose.
# ==========================================================
server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # CORS: origenes permitidos para /api/**. En dev alcanza con localhost
      # (React embebido, o "npm run dev" en :5173). En prod se pasa la URL
      # del frontend en Vercel por variable de entorno GATEWAY_ALLOWED_ORIGINS
      # (coma-separada; admite comodines, ej "https://tu-app-*.vercel.app"
      # para las preview deployments).
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: ${GATEWAY_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
            allowed-methods: [GET, POST, PUT, DELETE, OPTIONS]
            allowed-headers: [Authorization, Content-Type]
            allow-credentials: false
      routes:
        - id: auth-service
          uri: ${SERVICES_AUTH_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        - id: usuarios-service
          uri: ${SERVICES_USUARIOS_URL:http://localhost:8082}
          predicates:
            - Path=/api/usuarios/**,/api/admin/**

        - id: catalogo-service-api
          uri: ${SERVICES_CATALOGO_URL:http://localhost:8083}
          predicates:
            - Path=/api/juegos/**,/api/secciones/**

        - id: catalogo-service-uploads
          uri: ${SERVICES_CATALOGO_URL:http://localhost:8083}
          predicates:
            - Path=/uploads/**

# --- JWT: solo la clave publica; el gateway solo valida ---
# En prod se monta la clave real y se apunta con APP_JWT_PUBLIC_KEY_LOCATION
# (ej. file:/run/keys/jwt-public.pem). Por defecto usa la del classpath (demo).
app:
  jwt:
    public-key-location: ${APP_JWT_PUBLIC_KEY_LOCATION:classpath:jwt-public.pem}
    issuer: ${APP_JWT_ISSUER:gamestore-auth}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
