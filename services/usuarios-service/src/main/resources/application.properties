# ==========================================================
# usuarios-service - perfil por defecto (dev): H2 en memoria.
# ==========================================================
spring.application.name=usuarios-service
server.port=8082

spring.datasource.url=jdbc:h2:mem:usuariosdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- JWT: solo validacion (clave publica). Este servicio no firma. ---
app.jwt.public-key-location=classpath:jwt-public.pem
app.jwt.issuer=gamestore-auth

# --- Otros servicios ---
app.services.auth-url=http://localhost:8081
app.services.catalogo-url=http://localhost:8083
app.internal.secret=dev-internal-secret-cambiar-en-prod

# --- Resilience4j ---
resilience4j.retry.instances.auth.max-attempts=3
resilience4j.retry.instances.auth.wait-duration=300ms
resilience4j.retry.instances.catalogo.max-attempts=3
resilience4j.retry.instances.catalogo.wait-duration=300ms
resilience4j.circuitbreaker.instances.catalogo.sliding-window-size=10
resilience4j.circuitbreaker.instances.catalogo.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.catalogo.wait-duration-in-open-state=10s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
