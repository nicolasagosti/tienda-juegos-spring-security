# usuarios-service - perfil "docker": Postgres propio (contenedor usuarios-db).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://usuarios-db:5432/usuariosdb}
spring.datasource.username=${DATABASE_USERNAME:usuarios}
spring.datasource.password=${DATABASE_PASSWORD:usuarios}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.public-key-location=${APP_JWT_PUBLIC_KEY_LOCATION:classpath:jwt-public.pem}
app.services.auth-url=${AUTH_URL:http://auth-service:8081}
app.services.catalogo-url=${CATALOGO_URL:http://catalogo-service:8083}
app.internal.secret=${INTERNAL_SECRET:dev-internal-secret-cambiar-en-prod}
