# ==========================================================
# catalogo-service - perfil por defecto (dev): H2 en memoria.
# ==========================================================
spring.application.name=catalogo-service
server.port=8083

spring.datasource.url=jdbc:h2:mem:catalogodb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- JWT: solo validacion ---
app.jwt.public-key-location=classpath:jwt-public.pem
app.jwt.issuer=gamestore-auth

# --- Otros servicios ---
app.services.usuarios-url=http://localhost:8082
app.internal.secret=dev-internal-secret-cambiar-en-prod

# --- Imagenes subidas por los vendedores ---
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Resilience4j: resolucion de vendedores ---
resilience4j.retry.instances.usuarios.max-attempts=2
resilience4j.retry.instances.usuarios.wait-duration=200ms
resilience4j.circuitbreaker.instances.usuarios.sliding-window-size=10
resilience4j.circuitbreaker.instances.usuarios.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.usuarios.wait-duration-in-open-state=10s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
