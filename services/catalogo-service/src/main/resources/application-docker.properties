# catalogo-service - perfil "docker": Postgres propio (contenedor catalogo-db).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://catalogo-db:5432/catalogodb}
spring.datasource.username=${DATABASE_USERNAME:catalogo}
spring.datasource.password=${DATABASE_PASSWORD:catalogo}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.public-key-location=${APP_JWT_PUBLIC_KEY_LOCATION:classpath:jwt-public.pem}
app.services.usuarios-url=${USUARIOS_URL:http://usuarios-service:8082}
app.internal.secret=${INTERNAL_SECRET:dev-internal-secret-cambiar-en-prod}

# Disco de imagenes: volumen montado en el contenedor (ver docker-compose.yml).
app.upload.dir=${UPLOAD_DIR:/data/uploads}
